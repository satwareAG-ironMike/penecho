title = "PenEcho fork scanner allowlist"

# Single global allowlist (this gitleaks/betterleaks schema takes a map, not
# an array of tables). Entries are content-bound (regexes match the extracted
# secret value) and limited to intentional, verified-safe fixtures:
#   - "wrong-key": C2 401 negative-test key in scripts/smoke-local-ai.sh
#     (spec 002 TC-003); the endpoint rejects any value, so it can never be
#     a real credential.
#   - "PEN-ABCD-2345": unambiguously fake upstream pairing fixture, replaced
#     in-tree by PEN-XXXX-0000 (spec 001 FR-005); only matches stale upstream
#     history commits, which are immutable (fork is pull-only).
# Keep this list minimal; a file-wide path allowlist is not acceptable here.

[allowlist]
description = "Intentional negative-test fixtures (verified safe 2026-08-31); see file header comments"
regexes = ['wrong-key', 'PEN-ABCD-2345']
